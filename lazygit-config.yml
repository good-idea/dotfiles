# If this config is not being read by lazygit,
# be sure to Symlink it:
#
# ln -s ~/.dotfiles/lazygit-config.yml ~/Library/Application\ Support/lazygit/config.yml

git:
  pagers:
    - colorArg: always
      pager: delta-themed --paging=never
# `o` opens the selected file through this command. It reuses a Neovim in the
# current tmux session only when that instance belongs to this exact worktree.
os:
  open: '~/.dotfiles/bin/tmux-nvim-open {{filename}}'

keybinding:
  files:
    toggleStagedAll: '<c-a>'
