# Light theme — inspired by Kanagawa Lotus.
set -g status-style "bg=#dcd5ac,fg=#545464"
set -g status-left '#[bg=#c8c093,fg=#43436c] 🐸 #S '

setw -g window-status-style "fg=#716e61"
setw -g window-status-current-format ' #[fg=#43436c,bold]#I #[fg=#545464,bold]#W#[fg=#c84053]#F '
setw -g window-status-format ' #[fg=#8a8980]#I #[fg=#716e61]#W '
setw -g window-status-current-style default
setw -g window-status-bell-style "bold,fg=#f2ecbc,bg=#c84053"

set -g pane-border-style "bg=#f2ecbc,fg=#c8c093"
set -g pane-active-border-style "bg=#f2ecbc,fg=#4d699b"
set -g window-style "fg=#545464,bg=#f2ecbc"

setw -g clock-mode-colour #4d699b
setw -g mode-style "bold,fg=#f2ecbc,bg=#4d699b"
set -g message-style "bold,fg=#f2ecbc,bg=#4d699b"
