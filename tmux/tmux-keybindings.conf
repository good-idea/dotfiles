# Prefix
unbind C-b
set -g prefix `
bind ` send-prefix

set -g extended-keys on
set -g extended-keys-format csi-u

# New window
unbind '"'
unbind %

bind 'x' split-window -c "#{pane_current_path}"
bind 'v' split-window -h -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Easy Config Reloads (save session, reload config, restore session)
bind r run-shell '~/.dotfiles/tmux/plugins/tmux-resurrect/scripts/save.sh' \; source-file ~/.tmux.conf \; run-shell '~/.dotfiles/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display "Config reloaded & session restored!"

# Pane (split) navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation with Cmd+Option+h/l
bind -n C-M-h previous-window
bind -n C-M-l next-window

# Vim selection:
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.dotfiles/utils/copy"

# Switch Sessions
bind-key -T prefix Tab switch-client -l

setw -g mode-keys vi
