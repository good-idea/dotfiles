# =============================================================================
# TMUX Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Core Settings
# -----------------------------------------------------------------------------
set-option -g default-shell /bin/zsh
set-option -g default-command "reattach-to-user-namespace -l zsh"
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',screen-256color:RGB'

set -g focus-events on
set-option -sg escape-time 10

# Don't rename windows automatically
set-option -g allow-rename off

# Enable mouse mode
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Source keybindings
source-file ~/.dotfiles/tmux/tmux-keybindings.conf

set -g extended-keys on
set -g extended-keys-format csi-u

# -----------------------------------------------------------------------------
# Visual Settings
# -----------------------------------------------------------------------------

# Status bar
set -g status-justify left
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#24292D"
set -g status-left '#[bg=colour192,fg=colour000] 🐸 #S '
set -g status-left-length 20
set -g status-right ''
set -g status-right-length 50

# Window status
setw -g window-status-style none
setw -g window-status-current-format ' #[fg=colour112]#I #[fg=colour189]#W#[fg=colour75]#F '
setw -g window-status-format ' #[fg=colour107]#I #[fg=colour108]#W '
setw -g window-status-current-style bold
setw -g window-status-bell-style "bold,fg=colour255,bg=colour1"

# Pane borders
set -g pane-border-style "bg=#24292D,fg=colour241"
set -g pane-active-border-style "bg=#24292D,fg=colour221"

# Window background
set -g window-style "fg=terminal,bg=#24292D"

# Mode style (copy mode, etc.)
setw -g clock-mode-colour colour135
setw -g mode-style "bold,fg=colour196,bg=colour238"

# Message style
set -g message-style "bold,fg=colour232,bg=colour166"

# -----------------------------------------------------------------------------
# Notifications
# -----------------------------------------------------------------------------
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# -----------------------------------------------------------------------------
# Session Behavior
# -----------------------------------------------------------------------------
# Create a default session if none exists (needed for terminal auto-start)
# The -A flag attaches to existing session or creates new one
new-session -A -s main

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.dotfiles/tmux/plugins'

# Core plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Navigation and mouse
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @scroll-speed-num-lines-per-scroll "1"

# Session management - fuzzy finder session picker
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
# Enable zoxide integration for directory-based session creation
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
# Use tree mode by default - shows session/window hierarchy
set -g @sessionx-tree-mode 'on'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
# Clean up the UI - no icons, simple pointer
set -g @sessionx-prompt ': '
set -g @sessionx-pointer '> '

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect options
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-delete-backup-after '7'

# Continuum options
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# -----------------------------------------------------------------------------
# Initialize TPM (MUST be at the very bottom)
# -----------------------------------------------------------------------------
run -b '~/.dotfiles/tmux/plugins/tpm/tpm'
